[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conservative-force-simulation"
version = "1.0.0"
description = "Scientific computing engine solving non-linear conservative potential ODEs via Runge-Kutta RK45."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nguyen Huynh Dang Nhut", email = "dangnhutnguyen.work@gmail.com" }
]
keywords = [
    "scientific-computing",
    "runge-kutta-rk45",
    "ordinary-differential-equations",
    "physics-simulation",
    "sympy",
    "computational-physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sympy>=1.12.0",
    "matplotlib>=3.7.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
